<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Four-color quadrant badge: Tottenham navy / Vikings purple / Lynx green / Wolves grey -->
  <g>
    <path d="M256,256 L0,256 A256,256 0 0,1 256,0 Z" fill="#1B3A6B"/>
    <path d="M256,256 L256,0 A256,256 0 0,1 512,256 Z" fill="#4F2683"/>
    <path d="M256,256 L512,256 A256,256 0 0,1 256,512 Z" fill="#575959"/>
    <path d="M256,256 L256,512 A256,256 0 0,1 0,256 Z" fill="#1B7A43"/>
  </g>
  <circle cx="256" cy="256" r="250" fill="none" stroke="#F2F2F5" stroke-width="14"/>

  <!-- Goofy mashup creature: lynx-eared, wolf-snouted, viking-helmeted -->
  <g stroke="#111318" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears (large pointed lynx tufts) -->
    <polygon points="165,215 138,82 226,178" fill="#F2F2F5"/>
    <polygon points="347,215 374,82 286,178" fill="#F2F2F5"/>
    <line x1="152" y1="108" x2="140" y2="78"/>
    <line x1="360" y1="108" x2="372" y2="78"/>

    <!-- viking helmet -->
    <path d="M170,175 A90,80 0 0,1 342,175 L342,160 A86,76 0 0,0 170,160 Z" fill="#B9BEC4"/>
    <path d="M170,178 Q256,140 342,178 L342,158 Q256,120 170,158 Z" fill="#9EA6AE"/>
    <path d="M172,168 C130,150 108,110 122,72 C140,100 158,118 182,132 Z" fill="#DCE0E4"/>
    <path d="M340,168 C382,150 404,110 390,72 C372,100 354,118 330,132 Z" fill="#DCE0E4"/>
    <circle cx="256" cy="150" r="10" fill="#DCE0E4"/>

    <!-- head: narrower, taller oval (less round/wide than a bear) -->
    <ellipse cx="256" cy="298" rx="112" ry="128" fill="#F2F2F5"/>

    <!-- lynx cheek ruffs -->
    <polygon points="152,305 100,342 128,414 178,378 168,330" fill="#F2F2F5"/>
    <polygon points="360,305 412,342 384,414 334,378 344,330" fill="#F2F2F5"/>

    <!-- eyes (narrower set, slightly angled for an alert look) -->
    <circle cx="207" cy="272" r="21" fill="#111318"/>
    <circle cx="305" cy="272" r="21" fill="#111318"/>
    <circle cx="214" cy="264" r="6" fill="#F2F2F5"/>
    <circle cx="312" cy="264" r="6" fill="#F2F2F5"/>

    <!-- tapered wolf/lynx snout -->
    <path d="M212,320 Q256,300 300,320 Q300,368 256,388 Q212,368 212,320 Z" fill="#F2F2F5"/>
    <polygon points="256,318 242,336 270,336" fill="#111318"/>
    <path d="M225,362 Q256,382 287,362" fill="none"/>

    <!-- whiskers (extend past the cheek ruffs) -->
    <line x1="170" y1="335" x2="80" y2="320" stroke-width="5"/>
    <line x1="172" y1="352" x2="82" y2="352" stroke-width="5"/>
    <line x1="342" y1="335" x2="432" y2="320" stroke-width="5"/>
    <line x1="340" y1="352" x2="430" y2="352" stroke-width="5"/>
  </g>

  <!-- football clutched in teeth, bottom center -->
  <g stroke="#111318" stroke-width="5" stroke-linejoin="round">
    <circle cx="256" cy="410" r="34" fill="#F2F2F5"/>
    <polygon points="256,388 268,398 264,412 248,412 244,398" fill="#111318"/>
    <line x1="256" y1="376" x2="256" y2="388"/>
    <line x1="268" y1="398" x2="290" y2="392"/>
    <line x1="244" y1="398" x2="222" y2="392"/>
    <line x1="264" y1="412" x2="272" y2="432"/>
    <line x1="248" y1="412" x2="240" y2="432"/>
  </g>
</svg>
